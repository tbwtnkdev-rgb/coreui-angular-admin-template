# Serves the built Angular bundle and reverse-proxies /api to the API
# container. Same-origin from the browser's point of view, matching the dev
# proxy in src/proxy.conf.json — neither service needs to know CORS exists.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets carry a content hash in their filename, so caching them
    # hard is safe: a changed file is a different URL, never a stale one
    # served under an old name.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any path nginx can't find as a real file falls
    # back to index.html, and Angular's router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
