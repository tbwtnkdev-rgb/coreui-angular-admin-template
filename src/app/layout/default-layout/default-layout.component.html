<!--sidebar-->
<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  id="sidebar1"
  visible
>
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand [routerLink]="['/dashboard']" class="app-brand">
      <span class="app-brand__mark" aria-hidden="true"></span>
      <span class="app-brand__text">
        <strong>Console</strong>
        <small>Analytics</small>
      </span>
    </c-sidebar-brand>
  </c-sidebar-header>

  <!-- Native overflow rather than a scrollbar library: the sidebar is a
       plain scrolling column, and the OS scrollbar already knows how to
       behave on every platform we ship to. -->
  <div class="sidebar-scroll">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </div>

  @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer />
</div>
