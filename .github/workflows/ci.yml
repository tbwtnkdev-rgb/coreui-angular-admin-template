name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer run on the same branch makes the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          # Angular 22 refuses anything below this.
          node-version: 24.15.0
          cache: npm

      # `npm install`, not `npm ci`, and that is a known compromise. The
      # committed lockfile was generated on Windows, where @angular/cli
      # resolves listr2@10.2.2; on Linux the same tree wants listr2@10.2.1, so
      # `npm ci` rejects the lockfile it is handed. Tracked in #16 — once the
      # lockfile is regenerated on Linux this goes back to `npm ci`.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx ng build --configuration production

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Database
    runs-on: ubuntu-latest

    # A service container rather than compose: the runner manages the
    # lifecycle and the health gate, and the job cannot start querying before
    # the server is ready to answer.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dashboard
          POSTGRES_USER: dashboard
          # Local to this runner and destroyed with it. Not a secret, and
          # pretending otherwise by putting it in the secret store would only
          # make the real secrets harder to find.
          POSTGRES_PASSWORD: ci-throwaway
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dashboard
      PGUSER: dashboard
      PGPASSWORD: ci-throwaway

    steps:
      - uses: actions/checkout@v7

      - name: Apply schema
        run: |
          shopt -s nullglob
          for file in db/*.sql; do
            echo "── $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Run schema tests
        run: |
          shopt -s nullglob
          for file in db/tests/*.sql; do
            echo "── $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Report schema
        run: |
          echo "### Tables" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          psql -c "\dt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dashboard
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: ci-throwaway
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: dashboard
      PGUSER: dashboard
      PGPASSWORD: ci-throwaway

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0

      # The API tests read real rows, so they need the schema and the seed.
      - name: Apply schema and seed
        run: |
          for file in db/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

      # Unlike the root app's lockfile, this one has no platform-specific
      # entries — express and pg are pure JS — so npm ci is safe here.
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      # Integration tests against the live database. A mocked pool would only
      # prove the mock matches the test's assumptions, which is the part most
      # likely to be wrong about the database.
      - name: Test
        working-directory: server
        run: npm test

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Local to this runner and destroyed with it — see the Database and API
      # jobs for why this is not a secret.
      - name: Write .env
        run: echo "POSTGRES_PASSWORD=ci-throwaway" > .env

      # --wait blocks until every service with a healthcheck reports healthy
      # (or fails the step if one doesn't), so this is the actual proof that
      # db -> api -> app come up in the right order and stay up, not just that
      # each Dockerfile builds in isolation. Wrapped in timeout so a stuck
      # container fails the job instead of running until the workflow's own
      # ceiling does.
      - name: Bring up the stack
        run: timeout 180 docker compose up -d --build --wait

      - name: Verify the app serves and can reach the database through the API
        run: |
          curl -sf http://localhost:8080/ | grep -qi '<title>' \
            || { echo "::error::app did not serve an HTML page"; exit 1; }

          health=$(curl -sf http://localhost:8080/api/health)
          echo "$health"
          echo "$health" | grep -q '"reachable":true' \
            || { echo "::error::/api/health did not report the database reachable"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  licences:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      # `npm install`, not `npm ci`, and that is a known compromise. The
      # committed lockfile was generated on Windows, where @angular/cli
      # resolves listr2@10.2.2; on Linux the same tree wants listr2@10.2.1, so
      # `npm ci` rejects the lockfile it is handed. Tracked in #16 — once the
      # lockfile is regenerated on Linux this goes back to `npm ci`.
      - name: Install
        run: npm install --no-audit --no-fund

      # The point of this project is that every dependency stays free to use.
      # A paid CoreUI PRO package appearing in the tree is a build failure, not
      # a code review comment.
      - name: Fail on proprietary CoreUI packages
        run: |
          if npm ls --all --parseable 2>/dev/null | grep -E 'node_modules/@coreui/(.*-)?pro'; then
            echo "::error::A CoreUI PRO package is in the dependency tree."
            exit 1
          fi
          echo "No proprietary CoreUI packages found."
