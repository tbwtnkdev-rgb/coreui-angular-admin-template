version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: build"
    groups:
      # Angular packages move together; separate PRs for each would only
      # produce a pile of unmergeable half-upgrades.
      angular:
        patterns:
          - "@angular/*"
      coreui:
        patterns:
          - "@coreui/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "type: chore"
      - "area: build"
